name: Merge Requirements

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-test-plan:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Verify test plan checkboxes
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const help = '\n\nYour PR description must include a "## Test Plan" section with checkbox items:\n\n## Test Plan\n- [ ] Verified feature works locally\n- [ ] Tested edge cases\n\nCheck off each item (replace [ ] with [x]) once completed. All items must be checked to merge.';

            // Find the Test Plan section
            const testPlanMatch = body.match(/## Test Plan[\s\S]*?(?=\n## |\n---|$)/i);
            if (!testPlanMatch) {
              core.setFailed('PR must include a "## Test Plan" section.' + help);
              return;
            }

            const section = testPlanMatch[0];
            const unchecked = (section.match(/- \[ \]/g) || []).length;
            const checked = (section.match(/- \[x\]/gi) || []).length;

            if (checked + unchecked === 0) {
              core.setFailed('Test Plan section must contain at least one checkbox item.' + help);
            } else if (unchecked > 0) {
              core.setFailed(`${unchecked} of ${checked + unchecked} test plan item(s) still unchecked. Check off each item in your PR description (replace [ ] with [x]) before merging.`);
            } else {
              core.info(`All ${checked} test plan items are checked.`);
            }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test -- --run
