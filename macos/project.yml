name: SWTTR
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    macOS: "14.0"
packages:
  SWTTRShellKit:
    path: ../apple/SWTTRShellKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  SWTTR:
    type: application
    platform: macOS
    sources:
      - path: SWTTR
        excludes:
          - Info.plist
          - SWTTR.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swttr.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SWTTR/Info.plist
        CODE_SIGN_ENTITLEMENTS: SWTTR/SWTTR.entitlements
    dependencies:
      - package: SWTTRShellKit
    scheme:
      gatherCoverageData: false
